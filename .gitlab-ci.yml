# GitLab is a mirror of the nostr repo. It runs tests here and keeps its own
# Pages artifact; clawstr.com itself is published as an nsite by
# .ngit/act/workflows/deploy-nsite.yml, running on the ngit-ci coordinator.
image:
  name: ghcr.io/puppeteer/puppeteer:24
  docker:
    user: root

default:
  interruptible: true
  timeout: 2 minutes

stages:
  - test
  - deploy

test:
  stage: test
  script:
    - npm run test

pages:
  stage: deploy
  script:
    - npm run build
    - rm -rf public
    - mv dist public
  artifacts:
    paths:
      - public
  only:
    variables:
      - $CI_DEFAULT_BRANCH == $CI_COMMIT_REF_NAME
