name: Deploy nsite

# Builds dist/ and publishes it as the named nsite "clawstr" (NIP-5A kind
# 35128) described by .nsite/config.json: the files become Blossom blobs, the
# manifest mapping path -> sha256 goes to relays, and npanel on venus serves
# clawstr.com from it. Runs on pushes to the default branch, alongside Test.
#
# Secrets are provisioned by the ngit-ci operator as
# NGIT_CI_SECRET_<ALIAS>__<NAME> (note the double underscore) and injected
# ONLY on maintainer-authored triggers, which a push to a watched repo always
# is. This job needs one:
#   NSYTE_BUNKER   nbunksec1... -- a pre-established NIP-46 session, the form
#                  nsyte documents for CI. THE SIGNING PUBKEY IS THE SITE
#                  ADDRESS, so this secret decides whose namespace the site
#                  lives in.
# An empty NSYTE_BUNKER fails the job rather than skipping quietly: this is the
# only workflow that publishes the client anywhere, so a skipped run would
# leave the nsite silently pinned to an older build.

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Ahead of the build, so a config nsyte will not accept costs seconds
      # rather than failing at the end of a green-looking run.
      - name: Install nsyte and validate the config
        env:
          NSYTE_BUNKER: ${{ secrets.NSYTE_BUNKER }}
        run: |
          set -eu
          : "${NSYTE_BUNKER:?NSYTE_BUNKER is not set; ask the ngit-ci operator to provision it for this repo alias.}"

          # Pin the binary. An unversioned install has been observed pulling
          # 0.10.1, which emits legacy kind-34128 events that every current
          # gateway ignores while still reporting a successful deploy.
          # --retry-all-errors covers the transport faults this download has
          # actually hit here ("SSL_read: decryption failed or bad record
          # mac"), which curl does not consider retryable on its own. -f keeps
          # an HTTP error page from being saved as the binary, and the version
          # check fails the step rather than letting a truncated download
          # surface later as a confusing nsyte error.
          curl -fsSL --retry 5 --retry-delay 3 --retry-all-errors --max-time 300 \
            -o /usr/local/bin/nsyte \
            https://github.com/sandwichfarm/nsyte/releases/download/v0.27.2/nsyte-linux-0.27.2
          chmod +x /usr/local/bin/nsyte
          nsyte --version

          nsyte validate

      - run: npm ci

      # The prerenderer drives a real headless Chrome. The coordinator's image
      # ships puppeteer's Chrome download but not its shared libraries, so the
      # browser dies with "libnspr4.so: cannot open shared object file".
      # GitLab hid this by building inside ghcr.io/puppeteer/puppeteer.
      #
      # Package names are tried with and without the `t64` suffix: Ubuntu 24.04
      # renamed libatk1.0-0, libatk-bridge2.0-0, libcups2 and libasound2 in the
      # 64-bit time_t transition, and a single apt-get for the whole list fails
      # entirely if one name is wrong for the release in play. The launch check
      # at the end is what actually decides the step, so a genuinely missing
      # library still fails here rather than mid-build.
      - name: Install Chrome's shared libraries
        run: |
          set -eu
          # An `if`, not `[ ... ] && ...`: under `set -e` the latter aborts the
          # step when the test is false, which is precisely the root case.
          SUDO=""
          if [ "$(id -u)" -ne 0 ]; then SUDO=sudo; fi
          $SUDO apt-get update -qq
          for pkg in libnspr4 libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 \
                     libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 \
                     libxfixes3 libxrandr2 libgbm1 libpango-1.0-0 libcairo2 \
                     libasound2 fonts-liberation; do
            $SUDO apt-get install -y --no-install-recommends "$pkg" >/dev/null 2>&1 \
              || $SUDO apt-get install -y --no-install-recommends "${pkg}t64" >/dev/null 2>&1 \
              || echo "note: neither $pkg nor ${pkg}t64 is available"
          done
          npx puppeteer browsers install chrome
          # Prove the browser actually starts before spending a build on it.
          node -e "require('puppeteer').launch({args:['--no-sandbox','--disable-setuid-sandbox']}).then(b=>b.close()).then(()=>console.log('chrome launches'))"

      # Builds dist/ and writes 404.html (scripts/generate-404.js emits the
      # SPA shell with an empty #root), the path NIP-5A host servers fall
      # back to.
      - run: npm run build

      - name: Publish to Blossom + relays
        env:
          NSYTE_BUNKER: ${{ secrets.NSYTE_BUNKER }}
        run: |
          set -eu

          # Relays, servers and the site id all come from .nsite/config.json,
          # so they are versioned with the client rather than split across this
          # file. The secrets scan is skipped because it prompts on false
          # positives in our own bundle (pubkeys, bunker:// parsing code), and
          # a prompt is unanswerable here -- with -i it defaults to N and
          # aborts.
          set +e
          nsyte deploy dist \
            --sec "$NSYTE_BUNKER" \
            --concurrency 2 \
            --non-interactive \
            --skip-secrets-scan 2>&1 | tee /tmp/nsyte-deploy.log
          status="${PIPESTATUS[0]}"
          set -e

          # A deploy that changes no file exits NON-ZERO with "No new files to
          # upload". That is success: the manifest already on the relays
          # describes exactly this build.
          if [ "$status" -ne 0 ] && ! grep -q "No new files to upload" /tmp/nsyte-deploy.log; then
            exit "$status"
          fi
