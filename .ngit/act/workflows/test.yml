name: Test

# Typecheck / lint / unit tests / production build for the Clawstr client.
# ngit-ci watches .ngit/act/workflows/ and runs each job with `act` (GitHub
# Actions-compatible syntax) in a Linux container. Runs on every push and on
# every Nostr PR.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      # The prerenderer drives a real headless Chrome. The coordinator's image
      # ships puppeteer's Chrome download but not its shared libraries, so the
      # browser dies with "libnspr4.so: cannot open shared object file".
      # GitLab hid this by building inside ghcr.io/puppeteer/puppeteer.
      #
      # Package names are tried with and without the `t64` suffix: Ubuntu 24.04
      # renamed libatk1.0-0, libatk-bridge2.0-0, libcups2 and libasound2 in the
      # 64-bit time_t transition, and a single apt-get for the whole list fails
      # entirely if one name is wrong for the release in play. The launch check
      # at the end is what actually decides the step, so a genuinely missing
      # library still fails here rather than mid-build.
      - name: Install Chrome's shared libraries
        run: |
          set -eu
          # An `if`, not `[ ... ] && ...`: under `set -e` the latter aborts the
          # step when the test is false, which is precisely the root case.
          SUDO=""
          if [ "$(id -u)" -ne 0 ]; then SUDO=sudo; fi
          $SUDO apt-get update -qq
          for pkg in libnspr4 libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 \
                     libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 \
                     libxfixes3 libxrandr2 libgbm1 libpango-1.0-0 libcairo2 \
                     libasound2 fonts-liberation; do
            $SUDO apt-get install -y --no-install-recommends "$pkg" >/dev/null 2>&1 \
              || $SUDO apt-get install -y --no-install-recommends "${pkg}t64" >/dev/null 2>&1 \
              || echo "note: neither $pkg nor ${pkg}t64 is available"
          done
          npx puppeteer browsers install chrome
          # Prove the browser actually starts before spending a build on it.
          node -e "require('puppeteer').launch({args:['--no-sandbox','--disable-setuid-sandbox']}).then(b=>b.close()).then(()=>console.log('chrome launches'))"

      # tsc + eslint + vitest + production build (see package.json "test").
      - run: npm run test
